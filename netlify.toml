[[plugins]]
package = "@netlify/plugin-nextjs"

[build]
command   = "npm run build"
publish   = ".next"

[build.environment]
NEXT_TELEMETRY_DISABLED = "1"

[[headers]]
for = "/sw.js"
[headers.values]
  Cache-Control = "no-cache"

[[headers]]
for = "/*"
[headers.values]
  X-Frame-Options        = "DENY"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy        = "strict-origin-when-cross-origin"
